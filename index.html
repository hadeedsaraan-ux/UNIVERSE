<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System — Live Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04070d;
    --accent:#7fd6ff;
    --text:#eaf3ff;
    --mono:'Space Mono', monospace;
    --body:'Manrope', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;
    background:radial-gradient(ellipse at 50% 30%, #0a1128 0%, #050810 55%, #020308 100%);
    color:var(--text);font-family:var(--body);overflow:hidden;}
  #scene-container{position:fixed;inset:0;}
  #scene-container canvas{display:block;}

  #vignette{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
  }

  #topbar{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 26px;z-index:10;
    font-family:var(--mono);font-size:12px;letter-spacing:0.1em;
    color:rgba(234,243,255,0.7);
    pointer-events:none;
  }

  #back-btn{
    position:fixed;top:20px;left:26px;z-index:15;
    background:rgba(10,16,30,0.6);border:1px solid rgba(234,243,255,0.25);
    color:var(--text);font-family:var(--mono);font-size:12px;
    padding:9px 16px;border-radius:20px;cursor:pointer;letter-spacing:0.08em;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  #back-btn.visible{opacity:1;pointer-events:auto;}
  #back-btn:hover{border-color:var(--accent);color:var(--accent);}

  #name-tag{
    position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:14px;letter-spacing:0.15em;
    color:var(--accent);z-index:10;text-transform:uppercase;
    opacity:0;transition:opacity .4s ease;
  }
  #name-tag.visible{opacity:1;}

  #hint{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:12px;letter-spacing:0.08em;
    color:rgba(234,243,255,0.55);z-index:10;text-align:center;
    transition:opacity .5s ease;
  }
  #hint strong{color:var(--accent);}
</style>
</head>
<body>

<div id="scene-container"></div>
<div id="vignette"></div>

<div id="topbar">
  <span>SOLAR SYSTEM // LIVE BUILD</span>
</div>

<button id="back-btn">← back to overview</button>
<div id="name-tag"></div>
<div id="hint">drag to rotate · scroll to zoom out/in · <strong>click a body</strong> to focus and hear it</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script src="js/bodies-data.js"></script>
<script src="js/narration.js"></script>
<script src="js/engine.js"></script>

</body>
</html>
