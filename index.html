<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System — Live Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04070d;
    --accent:#7fd6ff;
    --text:#eaf3ff;
    --mono:'Space Mono', monospace;
    --body:'Manrope', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;
    background:radial-gradient(ellipse at 50% 30%, #0a1128 0%, #050810 55%, #020308 100%);
    color:var(--text);font-family:var(--body);overflow:hidden;}
  #scene-container{position:fixed;inset:0;}
  #scene-container canvas{display:block;}

  /* photographic vignette so it reads like a telescope frame, not a flat render */
  #vignette{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
  }

  #topbar{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 26px;z-index:10;
    font-family:var(--mono);font-size:12px;letter-spacing:0.1em;
    color:rgba(234,243,255,0.7);
    pointer-events:none;
  }

  #hint{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:12px;letter-spacing:0.08em;
    color:rgba(234,243,255,0.55);z-index:10;text-align:center;
    transition:opacity .5s ease;
  }
  #hint strong{color:var(--accent);}

  #info-panel{
    position:fixed;top:0;right:0;height:100%;
    width:min(360px, 86vw);
    background:rgba(6,10,20,0.88);
    backdrop-filter:blur(10px);
    border-left:1px solid rgba(127,214,255,0.15);
    padding:80px 30px 30px;
    transform:translateX(100%);
    transition:transform .5s cubic-bezier(.2,.9,.3,1);
    z-index:20;
  }
  #info-panel.visible{transform:translateX(0);}
  #info-panel h2{font-family:var(--mono);font-size:1.6rem;margin-bottom:20px;color:var(--accent);}
  #info-panel ul{list-style:none;display:flex;flex-direction:column;gap:14px;}
  #info-panel li{font-size:0.95rem;line-height:1.6;color:rgba(234,243,255,0.85);padding-left:16px;border-left:2px solid rgba(127,214,255,0.3);}
  #close-info{
    position:absolute;top:26px;right:26px;
    background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;
  }
</style>
</head>
<body>

<div id="scene-container"></div>
<div id="vignette"></div>

<div id="topbar">
  <span>SOLAR SYSTEM // LIVE BUILD</span>
</div>

<div id="hint">drag to rotate · scroll to zoom out/in · <strong>click a body</strong> to learn about it</div>

<div id="info-panel">
  <button id="close-info" aria-label="close">✕</button>
  <h2 id="info-name">—</h2>
  <ul id="info-facts"></ul>
</div>

<!-- Three.js core + controls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- postprocessing (for real bloom/glow, telescope-photo look) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<!-- our project files -->
<script src="js/bodies-data.js"></script>
<script src="js/narration.js"></script>
<script src="js/engine.js"></script>

</body>
</html>
